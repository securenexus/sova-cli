name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  dogfood:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: SOVA scans itself
        run: node bin/sova.js scan --path . --output /tmp/sova-self-scan.json --quiet
      - name: Verify manifest was generated
        run: test -f /tmp/sova-self-scan.json
