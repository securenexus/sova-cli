name: Bug Report
description: Report a bug in SOVA
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SOVA Version
      description: "Output of `sova --version`"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js Version
      description: "Output of `node --version`"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
